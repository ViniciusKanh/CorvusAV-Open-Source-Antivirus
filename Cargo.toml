[workspace]
resolver = "2"
members = [
    "crates/corvus-core",
    "crates/corvus-policy",
    "crates/corvus-storage",
    "crates/corvus-clamav",
    "crates/corvus-scanner",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
authors = ["CorvusAV Contributors"]

[workspace.dependencies]
corvus-core = { path = "crates/corvus-core" }
corvus-policy = { path = "crates/corvus-policy" }
corvus-storage = { path = "crates/corvus-storage" }
corvus-clamav = { path = "crates/corvus-clamav" }
corvus-scanner = { path = "crates/corvus-scanner" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
